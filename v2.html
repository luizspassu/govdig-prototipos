<style>
:root{--ink:#201547;--muted:#646577;--orange:#d23b13;--line:#e3e4eb;--bg:#f5f6fa;--soft:#eeebf6;--green:#196247}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #926700}button{cursor:pointer}button,.btn{min-height:44px;border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:white;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}button:hover,.btn:hover{background:var(--soft)}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#382564}button:disabled{cursor:not-allowed;opacity:.55}.danger{color:#a32929}a{color:#403080}.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.side{padding:28px 18px;background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:30px}.brand{font-size:26px;font-weight:800;letter-spacing:-1px}.brand b{color:var(--orange)}.brand small{display:block;font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:600;margin-top:2px}.nav{display:flex;flex-direction:column;gap:8px}.nav a{min-height:48px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}.nav a.on{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 var(--orange)}.num{font-size:12px;opacity:.65}.aside-note{margin-top:auto;color:var(--muted);font-size:12px}.side footer{display:grid;gap:8px}.top{padding:18px 36px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:white;flex-wrap:wrap}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--orange)}.top-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.top-controls label{font-size:12px;color:var(--muted);display:grid;gap:3px}.top select{min-height:44px;background:white;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);max-width:100%}main{max-width:1320px;margin:auto;padding:28px 36px 60px;min-width:0}.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:22px;color:var(--muted)}.crumb a{padding:8px 0;min-height:44px;display:inline-flex;align-items:center}.heading{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}.heading h1{font-size:30px;line-height:1.2;margin:5px 0 10px;letter-spacing:-.8px}.sub{color:var(--muted);max-width:760px;margin:0}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.panel h2{font-size:19px;margin:0 0 16px}.panel h3{font-size:16px;margin:0 0 8px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.chips{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:650;background:var(--soft);color:#443766}.tag.good{background:#e5f4ed;color:var(--green)}.tag.warn{background:#fff1d6;color:#785000}.tag.neutral{background:#f1f2f5;color:#5d6070}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.stat{padding:18px 22px;background:white;border:1px solid var(--line);border-radius:10px}.stat strong{font-size:28px;display:block}.stat span{font-size:13px;color:var(--muted)}.task{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0;padding-bottom:0}.task:first-of-type{padding-top:0}.task p{font-size:14px;color:var(--muted);margin:5px 0}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:0 0 24px;overflow-x:a ck input{width:22px;height:22px;min-height:22px;margin-top:3px;flex-shrink:0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.err{color:#a32929;font-size:14px;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:16px 24px;border-radius:9px;z-index:20;max-width:90vw;box-shadow:0 6px 30px #0002}.prototype{background:#201547;color:white;padding:8px 24px;font-size:12px;text-align:center}dialog{border:0;border-radius:14px;max-width:620px;width:90vw;padding:28px;max-height:85vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#17112b99}.skip{position:fixed;top:-100px;left:20px;z-index:99;background:white;padding:12px}.skip:focus{top:10px}.mobile-menu{display:none}.footer-note{font-size:12px;color:var(--muted);margin-top:28px}

</style></head><body><a class="skip" href="#main">Pular para conteúdo</a><div class="prototype">Protótipo conceitual V2 · Dados fictícios · Alterações salvas somente neste navegador</div><div class="shell"><aside class="side"><div class="brand">gov<b>dig</b><small>PORTFÓLIO CONECTADO</small></div><nav class="nav" aria-label="Navegação principal"></nav><div class="aside-note">Uma base de informações.<br>Diferentes contextos de trabalho.<br><br>Conceito 0.1 · Outubro 2026</div><footer><button onclick="help()">Roteiro de exploração</button><button onclick="resetDemo()">Reiniciar demonstração</button></footer></aside><div><header class="top"><div class="eyebrow">Governança digital / V2</div><div class="top-controls"><label>Período de análise<select id="period" onchange="setPeriod(this.value)"><option value="2026-T1">1º trimestre · 2026</option><option value="2026-T2">2º trimestre · 2026</option><option value="2026-T3">3º trimestre · 2026</option><option value="2026-T4">4º trimestre · 2026</option></select></label><label>Simular perfil<select id="role" onchange="setRole(this.value)"><option>Master</option><option>Gerente</option><option>Scrum Master</option></select></label><button onclick="help()" aria-label="Ajuda e roteiro do protótipo">Ajuda</button></div></header><main id="main" tabindex="-1"></main></div></div><dialog id="dialog"></dialog><div id="messages" aria-live="polite"></div>
<script>
'use strict';
const KEY='govdig-v2-conceito-01';const seed={period:'2026-T2',role:'Master',evolutions:[],assessments:[{p:'p1',period:'2026-T1',result:'Enquadrável',reason:'Cenário fictício: avaliação do primeiro período concluída.',evidence:'Relato técnico T1',by:'Master',at:'Demonstração inicial'},{p:'p2',period:'2026-T2',result:'Não enquadrável',reason:'Cenário fictício de decisão negativa para contraste.',evidence:'Relato técnico T2',by:'Master',at:'Demonstração inicial'}],items:[],history:[]};let S;try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{S=structuredClone(seed)}
const contracts=[{id:'c1',name:'Transformação Digital',client:'Cliente Aurora',manager:'Gerente Demo',team:'Equipe Horizonte'},{id:'c2',name:'Serviços Conectados',client:'Cliente Boreal',manager:'Gerente Demo',team:'Equipe Norte'}];
const products=[{id:'p1',c:'c1',name:'Portal de Serviços',status:'Em execução',sm:'Scrum Demo',team:'Equipe Horizonte',people:4,tech:['Plataforma web','Banco relacional'],initiatives:['Lei do Bem','ISG'],desc:'Simplificar o acesso aos serviços digitais em uma experiência integrada.'},{id:'p2',c:'c1',name:'Atendimento Assistido',status:'Planejamento',sm:'Scrum Demo',team:'Equipe Horizonte',people:4,tech:['Automação'],initiatives:['Lei do Bem'],desc:'Explorar novos recursos de apoio ao atendimento.'},{id:'p3',c:'c2',name:'Gestão de Solicitações',status:'Em execução',sm:'Outro SM Demo',team:'Equipe Norte',people:3,tech:['Plataforma web'],initiatives:[],desc:'Organizar o fluxo de solicitações do contrato.'}];
let tab='contracts',query='',contractFilter='',program='Lei do Bem',subtab='participants',productTab='overview',cycleTab='Trimestres',group='Grupo piloto',backRoute='portfolio',historyRoutes=[];
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pBy=id=>products.find(p=>p.id===id),cBy=id=>contracts.find(c=>c.id===id),isMaster=()=>S.role==='Master',canEdit=p=>S.role!=='Scrum Master'||p.id!=='p3',periodName=()=>S.period.replace('2026-T','')+'º trimestre · 2026';
const currentAssessment=p=>S.assessments.filter(a=>a.p===p&&a.period===S.period).at(-1),evolved=p=>S.evolutions.some(e=>e.p===p&&e.period===S.period),badge=(t,kind='')=>'<span class="tag '+kind+'">'+esc(t)+'</span>',link=(text,route,cls='btn')=>'<a class="'+cls+'" href="#'+route+'">'+text+'</a>',opt=(value,text,selected)=>'<option value="'+esc(value)+'" '+(selected?'selected':'')+'>'+esc(text)+'</option>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{notify('Armazenamento indisponível. As alterações permanecem nesta sessão.')}}function log(action,p='',detail=''){S.history.unshift({action,p,detail,by:S.role,at:new Date().toLocaleString('pt-BR')});save()}function notify(text){el('messages').innerHTML='<div class="toast" role="status">'+esc(text)+'</div>';setTimeout(()=>el('messages').innerHTML='',4500)}
function go(route){location.hash=route}function route(){return location.hash.slice(1)||'home'}function setPeriod(v){S.period=v;save();render()}function setRole(v){S.role=v;save();render()}function crumbs(items){return '<div class="crumb">'+items.map((x,i)=>x[1]?'<a href="#'+x[1]+'">'+esc(x[0])+'</a>':esc(x[0])).join('<span aria-hidden="true">/</span>')+'</div>'}function title(k,t,d,action=''){return '<div class="heading"><div><div class="eyebrow">'+esc(k)+'</div><h1>'+esc(t)+'</h1><p class="sub">'+esc(d)+'</p></div>'+action+'</div>'}function notice(t,info=false){return '<div class="notice '+(info?'info':'')+'">'+t+'</div>'}function context(p){const c=cBy(p.c);return '<div class="context"><div><small>Contrato</small>'+link(esc(c.name),'contract/'+c.id,'')+'</div><div><small>Produto/Serviço</small>'+esc(p.name)+'</div><div><small>Período de análise</small>'+periodName()+'</div></div>'}
function render(){const r=route(),[page,id]=r.split('/');el('period').value=S.period;el('role').value=S.role;const active=page==='home'?'home':['portfolio','contract','product','evolution'].includes(page)?'portfolio':['initiatives','assessment','cycle'].includes(page)?'initiatives':'results';document.querySelector('.nav').innerHTML=[['home','Início'],['portfolio','Portfólio'],['initiatives','Iniciativas'],['results','Resultados']].map(([key,label],i)=>'<a href="#'+key+'" class="'+(active===key?'on':'')+'" '+(active===key?'aria-current="page"':'')+'><span class="num">0'+(i+1)+'</span>'+label+'</a>').join('');const views={home,portfolio,contract:()=>contract(id),product:()=>product(id),evolution:()=>evolution(id),initiatives:()=>{if(id==='reviews'){program='Lei do Bem';subtab='reviews'}else if(id==='ISG'){program='ISG'}return initiatives()},assessment:()=>assessment(id),cycle,results};el('main').innerHTML=views[page]?views[page]():home();document.title='GovDig V2 · '+({'home':'Início','portfolio':'Portfólio','contract':'Contrato','product':'Produto','evolution':'Evolução','initiatives':'Iniciativas','assessment':'Avaliação','cycle':'Submissão','results':'Resultados'}[page]||'Início');el('main').insertAdjacentHTML('beforeend','<p class="footer-note">Proposta conceitual · Permissões e estados simulados, sujeitos à validação da equipe. <a href="index.html">Referências AS IS e TO BE v1</a></p>')}
function home(){const pending=products.filter(p=>canEdit(p)&&!evolved(p.id)),review=products.filter(p=>p.initiatives.includes('Lei do Bem')&&!currentAssessment(p.id));return title('Seu trabalho','O que precisa de atenção?','Abra a pendência e continue no produto e no período corretos.')+'<div class="stats"><div class="stat"><strong>'+pending.length+'</strong><span>evoluções a registrar</span></div><div class="stat"><strong>'+review.length+'</strong><span>avaliações em aberto</span></div><div class="stat"><strong>'+S.items.filter(i=>i.period===S.period).length+'</strong><span>itens na submissão do período</span></div></div><section class="panel"><h2>Próximas ações · '+periodName()+'</h2>'+pending.map((p,i)=>'<div class="task"><div>'+badge('Atualização do período','warn')+'<h3 style="margin-top:8px">'+esc(p.name)+'</h3><p>'+esc(cBy(p.c).name)+' · Evolução ainda não registrada na demonstração.</p></div>'+link('Registrar evolução','evolution/'+p.id,'btn '+(i===0?'primary':''))+'</div>').join('')+(!pending.length?'<p class="empty">As evoluções do seu escopo estão registradas. Você pode consultá-las no portfólio.</p>':'')+(isMaster()?review.map(p=>'<div class="task"><div>'+badge('Lei do Bem')+'<h3 style="margin-top:8px">Avaliar '+esc(p.name)+'</h3><p>Resultado do período ainda não registrado.</p></div>'+link('Revisar evidências','assessment/'+p.id)+'</div>').join(''):'')+'</section>'+notice('Os itens são cenários de demonstração. Calendário de obrigações, prazos e alertas precisam de definição do negócio.',true)}
function setTab(v){tab=v;render()}function productTable(list){return '<div class="table-wrap"><table><thead><tr><th>Produto/Serviço</th><th>Situação do produto</th><th>Iniciativas</th><th>Ação</th></tr></thead><tbody>'+list.map(p=>'<tr><td><b>'+esc(p.name)+'</b><small>'+esc(cBy(p.c).name)+'</small></td><td>'+badge(p.status,'neutral')+'</td><td><div class="chips">'+(p.initiatives.length?p.initiatives.map(x=>badge(x)).join(''):badge('Sem iniciativa','neutral'))+'</div></td><td>'+link('Abrir produto','product/'+p.id)+'</td></tr>').join('')+'</tbody></table></div>'}
function filterProducts(){return products.filter(p=>(!contractFilter||p.c===contractFilter)&&(!query||(p.name+' '+cBy(p.c).name).toLowerCase().includes(query.toLowerCase())))}
function portfolio(){return crumbs([['Portfólio']])+title('Base do portfólio','Contratos e entregas','Um mesmo produto, acessível pelo contrato ou diretamente pela lista.')+'<div class="tabs" aria-label="Visão do portfólio"><button class="'+(tab==='contracts'?'active':'')+'" onclick="setTab(\'contracts\')">Contratos</button><button class="'+(tab==='products'?'active':'')+'" onclick="setTab(\'products\')">Produtos/Serviços</button></div><form class="filters" onsubmit="event.preventDefault();applyFilters(this)"><label class="field">Buscar<input name="query" value="'+esc(query)+'" placeholder="Contrato ou produto"></label><label class="field">Contrato<select name="contract"><option value="">Todos os contratos</option>'+contracts.map(c=>opt(c.id,c.name,c.id===contractFilter)).join('')+'</select></label><button type="submit">Aplicar filtros</button><button type="button" onclick="query=\'\';contractFilter=\'\';render()">Limpar</button></form><section class="panel">'+(tab==='products'?(filterProducts().length?productTable(filterProducts()):'<p class="empty">Nenhum produto encontrado. Ajuste os filtros.</p>'):contracts.filter(c=>(!contractFilter||c.id===contractFilter)&&(!query||(c.name+' '+c.client).toLowerCase().includes(query.toLowerCase()))).map(c=>'<div class="task"><div><h2 style="margin:0">'+esc(c.name)+'</h2><p>'+esc(c.client)+' · '+products.filter(p=>p.c===c.id).length+' produtos · '+(c.id==='c1'?4:3)+' colaboradores únicos</p></div>'+link('Acompanhar contrato','contract/'+c.id)+'</div>').join('')||'<p class="empty">Nenhum contrato encontrado.</p>')+'</section>'}
function applyFilters(f){query=f.query.value;contractFilter=f.contract.value;render()}
function contract(id){const c=cBy(id);if(!c)return home();return crumbs([['Portfólio','portfolio'],[c.name]])+title('Contrato',c.name,c.client+' · Responsável: '+c.manager,link('Voltar ao portfólio','portfolio'))+'<div class="stats"><div class="stat"><strong>'+products.filter(p=>p.c===id).length+'</strong><span>produtos do contrato</span></div><div class="stat"><strong>1</strong><span>equipe compartilhada</span></div><div class="stat"><strong>'+(id==='c1'?4:3)+'</strong><span>pessoas únicas, sem somar vínculos</span></div></div><section class="panel"><h2>Produtos/Serviços</h2>'+productTable(products.filter(p=>p.c===id))+'</section><div class="split"><section class="panel"><h2>Equipe e atendimento</h2><b>'+esc(c.team)+'</b><p class="sub">'+(id==='c1'?'Atende os dois produtos deste contrato. As mesmas quatro pessoas não são contadas duas vezes.':'Atende o produto deste contrato com três pessoas.')+'</p></section><section class="panel"><h2>Participação nas iniciativas</h2><div class="chips">'+[...new Set(products.filter(p=>p.c===id).flatMap(p=>p.initiatives))].map(x=>badge(x)).join('')+'</div><p class="sub" style="margin-top:12px">Consolidado dos vínculos dos produtos.</p></section></div>'}
function setProductTab(v){productTab=v;render()}function product(id){const p=pBy(id);if(!p)return home();let body='';if(productTab==='overview')body='<div class="split"><section class="panel"><h2>O que este produto entrega</h2><p>'+esc(p.desc)+'</p><div class="chips">'+badge(p.status,'neutral')+'</div><h3 style="margin-top:24px">Tecnologias</h3><p>'+p.tech.map(esc).join(' · ')+'</p></section><section class="panel"><h2>Equipe e responsabilidade</h2><b>'+esc(p.team)+'</b><p>'+p.people+' integrantes · '+esc(p.sm)+'</p><p class="sub">O vínculo de equipe é compartilhado com a visão do contrato.</p></section></div>';if(productTab==='evolution')body='<section class="panel"><div class="row"><h2>Evoluções do produto</h2>'+(canEdit(p)?link('Registrar evolução','evolution/'+id,'btn primary'):'')+'</div>'+S.evolutions.filter(e=>e.p===id).map(e=>'<article class="event"><b>'+esc(e.period)+' · '+esc(e.activity)+'</b><p>'+esc(e.summary)+'</p><small>'+esc(e.evidence)+' · '+esc(e.at)+'</small></article>').join('')+(!S.evolutions.some(e=>e.p===id)?'<p class="empty">Nenhuma evolução registrada. Comece pelo período selecionado.</p>':'')+'</section>';if(productTab==='initiatives')body='<section class="panel"><h2>Participações deste produto</h2>'+p.initiatives.map(x=>'<div class="task"><div><h3>'+esc(x)+'</h3><p>Vínculo ativo na demonstração. Participar não significa estar enquadrado.</p></div>'+link('Abrir participação',x==='Lei do Bem'?'assessment/'+id:'initiatives/'+x)+'</div>').join('')+(!p.initiatives.length?'<p class="empty">Produto cadastrado sem iniciativa. Seu cadastro continua válido no portfólio.</p>':'')+'</section>';if(productTab==='history')body=historyPanel(id);return crumbs([['Portfólio','portfolio'],[cBy(p.c).name,'contract/'+p.c],[p.name]])+title('Produto/Serviço',p.name,'Uma entrega do contrato, com evolução e participações próprias.',link('Voltar ao contrato','contract/'+p.c))+context(p)+'<div class="tabs">'+[['overview','Visão geral'],['evolution','Evolução'],['initiatives','Iniciativas'],['history','Histórico']].map(([v,t])=>'<button class="'+(productTab===v?'active':'')+'" onclick="setProductTab(\''+v+'\')">'+t+'</button>').join('')+'</div>'+body}
function evolution(id){const p=pBy(id);if(!p)return home();if(!canEdit(p))return title('Escopo de edição','Produto fora da responsabilidade simulada','No perfil Scrum Master, este produto pertence a outro responsável.',link('Voltar ao produto','product/'+id));return crumbs([['Portfólio','portfolio'],[p.name,'product/'+id],['Registrar evolução']])+title('Atualização do período','Registrar evolução','Descreva o trabalho efetivamente realizado. A avaliação da iniciativa acontece em outra etapa.')+context(p)+'<form class="panel" onsubmit="event.preventDefault();saveEvolution(this,\''+id+'\')"><div class="fields"><label class="field">Natureza da atividade<select name="activity" required><option value="">Selecione</option><option>Desenvolvimento novo</option><option>Manutenção evolutiva</option><option>Sustentação e correções</option><option>Atividades mistas</option></select></label><label class="field">Referência de evidência<input name="evidence" required placeholder="Ex.: documento técnico ou registro da entrega"></label><label class="field wide">Evolução realizada<textarea name="summary" required minlength="12" placeholder="Descreva atividade, objetivo e resultado observado."></textarea></label></div>'+notice('Classificar a atividade não decide elegibilidade ou enquadramento. As regras finais serão validadas com os responsáveis.',true)+'<div class="actions"><button class="primary" type="submit">Salvar evolução</button>'+link('Cancelar','product/'+id)+'</div></form>'}
function saveEvolution(f,id){S.evolutions.push({p:id,period:S.period,activity:f.activity.value,evidence:f.evidence.value.trim(),summary:f.summary.value.trim(),at:new Date().toLocaleString('pt-BR')});log('Evolução registrada',id,S.period);productTab='evolution';go('product/'+id);notify('Evolução salva. O registro não representa aprovação da iniciativa.')}
function changeProgram(v){program=v;render()}function changeSub(v){subtab=v;render()}function initiatives(){const ps=products.filter(p=>p.initiatives.includes(program));return crumbs([['Iniciativas']])+title('Programas e participações','Iniciativas','O produto é cadastrado uma vez. Cada programa mantém suas operações e decisões.')+'<div class="tabs">'+['Lei do Bem','ISG','Outras'].map(v=>'<button class="'+(program===v?'active':'')+'" onclick="changeProgram(\''+v+'\')">'+v+'</button>').join('')+'</div>'+(program==='Lei do Bem'?'<div class="tabs">'+[['participants','Participantes'],['reviews','Avaliações'],['cycles','Ciclos de submissão']].map(([v,t])=>'<button class="'+(subtab===v?'active':'')+'" onclick="changeSub(\''+v+'\')">'+t+'</button>').join('')+'</div>':'')+(program==='Lei do Bem'&&subtab==='cycles'?'<section class="panel"><div class="task"><div><h2>Ciclo de submissão · 2026</h2><p>Agrupador anual do P&D atual. Produtos entram por trimestre ou agrupamento.</p>'+badge('Acesso atual: Master','neutral')+'</div>'+(isMaster()?link('Organizar submissão','cycle','btn primary'):'<p class="sub">Disponível para Master na simulação.</p>')+'</div></section>':program==='Lei do Bem'&&subtab==='reviews'?'<section class="panel"><h2>Avaliações · '+periodName()+'</h2>'+ps.map(p=>'<div class="task"><div><h3>'+esc(p.name)+'</h3><p>'+esc(cBy(p.c).name)+'</p>'+badge(currentAssessment(p.id)?.result||'Em análise',currentAssessment(p.id)?.result==='Enquadrável'?'good':'warn')+'</div>'+link(isMaster()?'Revisar avaliação':'Consultar avaliação','assessment/'+p.id)+'</div>').join('')+'</section>':'<section class="panel"><h2>Produtos participantes</h2>'+(ps.length?productTable(ps):'<p class="empty">Nenhum produto vinculado neste cenário.</p>')+'</section>')+(program!=='Lei do Bem'?notice('Nesta versão conceitual, as operações específicas de '+esc(program)+' serão detalhadas após validação do escopo.',true):notice('Elegibilidade, enquadramento e submissão são etapas distintas. A tela de avaliação demonstra o enquadramento por produto/período; a regra definitiva ainda precisa de aceite.',true))}
function assessment(id){const p=pBy(id);if(!p||!p.initiatives.includes('Lei do Bem'))return initiatives();const a=currentAssessment(id),ev=S.evolutions.filter(e=>e.p===id&&e.period===S.period),old=S.assessments.filter(a=>a.p===id);return crumbs([['Iniciativas','initiatives'],['Lei do Bem','initiatives'],[p.name,'product/'+id],['Avaliação']])+title('Lei do Bem · Avaliação do período','Avaliar participação','Decisão vinculada a este produto e período, com justificativa e histórico.',link('Voltar ao produto','product/'+id))+context(p)+'<div class="split"><section class="panel"><h2>Evidências do período</h2>'+(ev.length?ev.map(e=>'<article class="event"><b>'+esc(e.activity)+'</b><p>'+esc(e.summary)+'</p><small>'+esc(e.evidence)+'</small></article>').join(''):'<p class="sub">Ainda não há evolução registrada neste período.</p>')+(canEdit(p)?link('Registrar evolução','evolution/'+id):'')+'<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Elegibilidade inicial</h3><p class="sub">A confirmar · não inferida a partir do vínculo. A distinção entre elegibilidade e enquadramento será validada com a equipe.</p></section><section class="panel"><h2>Enquadramento · '+periodName()+'</h2>'+badge(a?.result||'Em análise',a?.result==='Enquadrável'?'good':'warn')+'<p class="sub" style="margin-top:14px">'+esc(a?.reason||'Registre a análise e os elementos que sustentam a decisão.')+'</p></section></div>'+(isMaster()?'<form class="panel" onsubmit="event.preventDefault();saveAssessment(this,\''+id+'\')"><h2>Registrar nova versão da avaliação</h2><div class="fields"><label class="field">Resultado proposto<select name="result" required><option value="">Selecione</option><option>Em análise</option><option>Enquadrável</option><option>Não enquadrável</option></select></label><label class="field">Referência da evidência<input name="evidence" required placeholder="Documento ou registro analisado"></label><label class="field wide">Justificativa<textarea name="reason" required minlength="12" placeholder="Explique a decisão deste produto neste período."></textarea></label></div>'+notice('Regra de simulação: Master registra a análise. Responsáveis reais, critérios e fechamento precisam de validação. Produtos e períodos diferentes mantêm avaliações independentes.')+'<div class="actions"><button class="primary">Salvar avaliação</button>'+link('Cancelar','initiatives')+'</div></form>':notice('Consulta no perfil simulado. A edição desta avaliação está reservada ao Master neste conceito.',true))+'<section class="panel"><h2>Versões e outros períodos</h2>'+old.slice().reverse().map(x=>'<article class="event"><b>'+esc(x.period)+' · '+esc(x.result)+'</b><p>'+esc(x.reason)+'</p><small>'+esc(x.evidence)+' · '+esc(x.by)+' · '+esc(x.at)+'</small></article>').join('')+(!old.length?'<p class="empty">Ainda não há decisões registradas.</p>':'')+'</section>'}
function saveAssessment(f,id){S.assessments.push({p:id,period:S.period,result:f.result.value,evidence:f.evidence.value.trim(),reason:f.reason.value.trim(),by:S.role,at:new Date().toLocaleString('pt-BR')});log('Nova versão de enquadramento',id,S.period+' · '+f.result.value);render();notify('Avaliação salva. As decisões anteriores foram preservadas.')}
function setCycleTab(v){cycleTab=v;render()}function cycle(){if(!isMaster())return title('Lei do Bem','Ciclos de submissão','Acesso atual do P&D preservado para Master nesta simulação.',link('Voltar às iniciativas','initiatives'));const recorte=cycleTab==='Trimestres'?S.period:group,items=S.items.filter(i=>i.kind===cycleTab&&i.recorte===recorte),eligible=products.filter(p=>p.initiatives.includes('Lei do Bem')&&currentAssessment(p.id)?.result==='Enquadrável'&&!items.some(i=>i.p===p.id));return crumbs([['Iniciativas','initiatives'],['Lei do Bem','initiatives'],['Ciclo 2026']])+title('Ciclo de submissão · Lei do Bem','Submissão 2026','O Projeto P&D anual, organizado por trimestre ou agrupamento.',link('Voltar às iniciativas','initiatives'))+'<div class="context"><div><small>Ano-base</small>2026</div><div><small>Nome</small>Ciclo de demonstração</div><div><small>Documentação</small>Link SharePoint a definir</div></div><div class="tabs">'+['Trimestres','Agrupamentos'].map(v=>'<button class="'+(cycleTab===v?'active':'')+'" onclick="setCycleTab(\''+v+'\')">'+v+'</button>').join('')+'</div>'+notice('Composição ilustrativa: só aparecem para inclusão os produtos com resultado Enquadrável no período selecionado. Contratos diferentes, agrupamentos e regras de envio ainda precisam de confirmação.')+'<section class="panel"><h2>'+(cycleTab==='Trimestres'?periodName():'Grupo piloto · referência '+periodName())+'</h2><div class="table-wrap"><table><thead><tr><th>Produto incluído</th><th>Contrato</th><th>Referência da decisão</th><th>Ação</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+esc(pBy(i.p).name)+'</td><td>'+esc(cBy(pBy(i.p).c).name)+'</td><td>'+esc(i.period)+' · versão '+i.version+'</td><td><button class="danger" onclick="askRemove(\''+i.id+'\')">Retirar da submissão</button></td></tr>').join('')+'</tbody></table></div>'+(!items.length?'<p class="empty">Nenhum produto incluído neste recorte. Escolha abaixo um produto já avaliado.</p>':'')+'</section><form class="panel" onsubmit="event.preventDefault();addItems(this)"><h2>Incluir produtos existentes</h2>'+eligible.map(p=>'<label class="check"><input type="checkbox" name="selected" value="'+p.id+'"><span><b>'+esc(p.name)+'</b><br>'+esc(cBy(p.c).name)+' · '+badge('Enquadrável','good')+'</span></label>').join('')+(!eligible.length?'<p class="sub">Nenhum produto disponível. Avalie um participante neste período ou consulte os itens já incluídos.</p>':'')+'<div class="actions"><button class="primary" '+(!eligible.length?'disabled':'')+'>Incluir selecionados</button>'+link('Consultar avaliações','initiatives/reviews')+'</div><p id="itemError" class="err" role="alert"></p></form>'+notice('Inclusão na demonstração não envia dados à Consultoria. Alterar a avaliação depois da inclusão sinaliza necessidade de revisão; o histórico da inclusão é mantido.',true)}
function addItems(f){const ids=[...new FormData(f).getAll('selected')];if(!ids.length){el('itemError').textContent='Selecione ao menos um produto para incluir.';return}ids.forEach(p=>{const count=S.assessments.filter(a=>a.p===p&&a.period===S.period).length;S.items.push({id:'i'+Date.now()+p,p,period:S.period,kind:cycleTab,recorte:cycleTab==='Trimestres'?S.period:group,version:count});log('Produto incluído na submissão',p,S.period+' · '+cycleTab)});render();notify('Produtos incluídos. O cadastro original foi preservado.')}
function askRemove(id){const i=S.items.find(x=>x.id===id);showDialog('<h2>Retirar '+esc(pBy(i.p).name)+' da submissão?</h2><p>O produto, suas evoluções e avaliações continuarão no portfólio. Só este vínculo será retirado.</p><div class="actions"><button class="primary" onclick="removeItem(\''+id+'\')">Confirmar retirada</button><button onclick="closeDialog()">Cancelar</button></div>')}
function removeItem(id){const i=S.items.find(x=>x.id===id);S.items=S.items.filter(x=>x.id!==id);log('Produto retirado da submissão',i.p,i.period+' · '+i.kind);closeDialog();render();notify('Vínculo retirado. O produto continua no portfólio.')}
function historyPanel(id=''){const list=S.history.filter(h=>!id||h.p===id);return '<section class="panel"><h2>Histórico de ações da demonstração</h2><div class="timeline">'+list.map(h=>'<article class="event"><b>'+esc(h.action)+'</b><p>'+esc(h.p?pBy(h.p).name:'')+' · '+esc(h.detail)+'</p><small>'+esc(h.by)+' · '+esc(h.at)+'</small></article>').join('')+'</div>'+(!list.length?'<p class="empty">As alterações realizadas no protótipo aparecerão aqui.</p>':'')+'</section>'}
function results(){const assessed=products.filter(p=>currentAssessment(p.id)),items=S.items.filter(i=>i.period===S.period);return crumbs([['Resultados']])+title('Consolidação rastreável','Resultados do período','Cada resultado mantém acesso ao produto e à decisão de origem.','<button class="primary" onclick="exportCSV()">Exportar resumo CSV</button>')+'<div class="stats"><div class="stat"><strong>'+products.length+'</strong><span>produtos no portfólio</span></div><div class="stat"><strong>'+assessed.length+'</strong><span>produtos com análise registrada</span></div><div class="stat"><strong>'+new Set(items.map(i=>i.p)).size+'</strong><span>produtos únicos incluídos no período</span></div></div><section class="panel"><h2>Enquadramento · '+periodName()+'</h2><div class="table-wrap"><table><thead><tr><th>Produto/Serviço</th><th>Decisão mais recente</th><th>Submissão</th><th>Origem</th></tr></thead><tbody>'+products.filter(p=>p.initiatives.includes('Lei do Bem')).map(p=>{const a=currentAssessment(p.id),incl=items.some(i=>i.p===p.id),needs=incl&&(a?.result!=='Enquadrável'||items.some(i=>i.p===p.id&&i.version!==S.assessments.filter(v=>v.p===p.id&&v.period===S.period).length));return '<tr><td>'+esc(p.name)+'<small>'+esc(cBy(p.c).name)+'</small></td><td>'+badge(a?.result||'Em análise',a?.result==='Enquadrável'?'good':'warn')+'</td><td>'+badge(needs?'Revisar inclusão':incl?'Incluído':'Não incluído',needs?'warn':'neutral')+'</td><td>'+link('Consultar decisão','assessment/'+p.id)+'</td></tr>'}).join('')+'</tbody></table></div></section><section class="panel"><h2>Informação financeira</h2><p class="sub">Fonte, competência, responsáveis e critérios de consolidação ainda precisam ser definidos. Nenhum valor ou benefício fiscal é calculado neste conceito.</p></section>'+historyPanel()}
function exportCSV(){const rows=[['Produto','Contrato','Periodo','Enquadramento','Incluido na submissao'],...products.map(p=>[p.name,cBy(p.c).name,S.period,currentAssessment(p.id)?.result||'Em análise',S.items.some(i=>i.p===p.id&&i.period===S.period)?'Sim':'Não'])];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='GovDig-V2-'+S.period+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notify('Resumo de demonstração exportado.')}
function showDialog(html){el('dialog').innerHTML=html;el('dialog').showModal()}function closeDialog(){el('dialog').close()}function help(){showDialog('<div class="eyebrow">Proposta conceitual 0.1</div><h2>Explore a lógica do V2</h2><ol class="list"><li><b>Acompanhar contrato:</b> Portfólio → Transformação Digital → Portal de Serviços.</li><li><b>Atualizar entrega:</b> Início → Registrar evolução. Salve atividade e evidência.</li><li><b>Avaliar Lei do Bem:</b> Iniciativas → Avaliações. No perfil Master, registre resultado e justificativa. Troque o trimestre para comparar decisões.</li><li><b>Organizar submissão:</b> Lei do Bem → Ciclos de submissão → 2026. Inclua um produto enquadrável; retire-o e confira que continua no portfólio.</li></ol><p>Regras e perfis são hipóteses explícitas de simulação. Dados locais e fictícios. Este HTML não comprova autorização ou desempenho no Power Apps.</p><p><a href="as-is.html" target="_blank" rel="noopener">Abrir AS IS</a> · <a href="to-be.html" target="_blank" rel="noopener">Abrir TO BE v1</a></p><button class="primary" onclick="closeDialog()">Começar exploração</button><button onclick="closeDialog();resetDemo()">Reiniciar demonstração</button>')}
function resetDemo(){showDialog('<h2>Reiniciar a demonstração?</h2><p>Os registros criados neste V2 serão removidos deste navegador. As referências AS IS e TO BE v1 mantêm seus próprios dados.</p><div class="actions"><button class="primary" onclick="S=structuredClone(seed);save();closeDialog();go(\'home\');render();notify(\'Demonstração reiniciada.\')">Reiniciar V2</button><button onclick="closeDialog()">Cancelar</button></div>')}
window.addEventListener('hashchange',()=>{render();el('main').focus();window.scrollTo(0,0)});render();
</script></body></html>
